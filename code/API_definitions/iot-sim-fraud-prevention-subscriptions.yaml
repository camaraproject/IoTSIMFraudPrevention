            GENERIC_400_SUBSCRIPTION_ID_REQUIRED:
              $ref: '#/components/examples/GENERIC_400_SUBSCRIPTION_ID_REQUIRED'
    NotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
