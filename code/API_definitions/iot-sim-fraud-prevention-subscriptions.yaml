openapi: 3.0.3
info:
  title: IoT SIM Fraud Prevention Subscriptions
  description: |
    API to subscribe to events related to SIM card binding and regional restrictions.

    # Introduction
    This API allows enterprise customers to subscribe to risk control information about IoT SIM cards.
    When a bound device changes IMEI or moves in/out of a restricted area, a notification is sent to the registered callback endpoint.

    # Relevant terms and definitions
    * **SIM card**: IoT network card (subscriber identity module).
    * **Binding**: mechanism linking a SIM card to a specific terminal device (IMEI) or area.
    * **Device**: any physical entity that can connect to a network.
    * **IMEI**: International Mobile Equipment Identity.

    # API Functionality
    The API provides endpoints to manage subscriptions:
    - `POST /subscriptions` – create a subscription.
    - `GET /subscriptions/{subscriptionId}` – retrieve a subscription.
    - `DELETE /subscriptions/{subscriptionId}` – delete a subscription.

    # Notifications
    When a subscribed event occurs, the server sends a `POST` request to the `sink` URL provided by the subscriber.
    The notification payload conforms to the CloudEvents specification.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

  version: wip
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-camara-commonalities: 0.9.0
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/IoTSIMFraudPrevention
servers:
  - url: "{apiRoot}/iot-sim-fraud-prevention-subscriptions/vwip"

    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Subscription Sim Card Fraud Prevention
    description: Operations for creating fraud prevention event subscriptions
  - name: Subscription Management
    description: Operations for managing existing subscriptions (list, retrieve, delete)
paths:
  /subscriptions:
    post:
      tags:
        - Subscription Sim Card Fraud Prevention
      summary: Subscribe to IMEI or area change events
      description: |
        Create a subscription to receive notifications when the IMEI of a device changes or when it enters/leaves a restricted area.
      operationId: subscribeFraudPrevention
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeFraudPreventionRequest"
            examples:
              INPUT_IPV4_ADDRESS:
                summary: Subscription For One Device By IPv4 Address
                description: Use the IPv4 address of a device for subscription operations
                value:
                  config:
                    subscriptionExpireTime: "2024-03-22T05:40:58.469Z"
                    initialEvent: true
                    subscriptionMaxEvents: 10
                    subscriptionDetail:
                      device:
                        ipv4Address:
                          publicAddress: "203.0.113.0"
                          publicPort: 59765
                  types:
                    - "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
                  sink: "https://notificationSendServer12.supertelco.com"
                  protocol: "HTTP"
                  sinkCredential:
                    credentialType: "ACCESSTOKEN"
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                    accessTokenExpiresUtc: "2024-03-23T05:40:58.469Z"
                    accessTokenType: "bearer"
              INPUT_IPV6_ADDRESS:
                summary: Subscription For One Device By IPV6 Address
                description: Use the IPv6 address of a device for subscription operations
                value:
                  config:
                    subscriptionExpireTime: "2024-03-22T05:40:58.469Z"
                    initialEvent: true
                    subscriptionMaxEvents: 10
                    subscriptionDetail:
                      device:
                        ipv6Address: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
                  types:
                    - "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
                  sink: "https://notificationSendServer12.supertelco.com"
                  protocol: "HTTP"
                  sinkCredential:
                    credentialType: "ACCESSTOKEN"
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                    accessTokenExpiresUtc: "2024-03-23T05:40:58.469Z"
                    accessTokenType: "bearer"
              INPUT_PHONE_NUMBER:
                summary: Subscription For One Device By Device Number
                description: Use a device's phone number for subscription operation
                value:
                  config:
                    subscriptionExpireTime: "2024-03-22T05:40:58.469Z"
                    initialEvent: true
                    subscriptionMaxEvents: 10
                    subscriptionDetail:
                      device:
                        phoneNumber: "+123456789"
                  types:
                    - "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
                  sink: "https://notificationSendServer12.supertelco.com"
                  protocol: "HTTP"
                  sinkCredential:
                    credentialType: "ACCESSTOKEN"
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                    accessTokenExpiresUtc: "2024-03-23T05:40:58.469Z"
                    accessTokenType: "bearer"
              INPUT_NETWORK_ACCESS_IDENTIFIER:
                summary: Subscription For One Device By Network Access Identification
                description: Use a device's network access identifier for subscription operations
                value:
                  config:
                    subscriptionExpireTime: "2024-03-22T05:40:58.469Z"
                    initialEvent: true
                    subscriptionMaxEvents: 10
                    subscriptionDetail:
                      device:
                        networkAccessIdentifier: "123456789@domain.com"
                  types:
                    - "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
                  sink: "https://notificationSendServer12.supertelco.com"
                  protocol: "HTTP"
                  sinkCredential:
                    credentialType: "ACCESSTOKEN"
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
                    accessTokenExpiresUtc: "2024-03-23T05:40:58.469Z"
                    accessTokenType: "bearer"
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: "notifications callback"
              description: |
                Important note: This endpoint will be implemented by API users.
                Whenever an IMEI or area change event occurs, the server will call this endpoint.
              operationId: postNotification
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/NotificationEvent"
                    examples:
                      IMEI_CHANGE:
                        description: The trigger event when the device IMEI has changed
                        value:
                          specversion: "1.0"
                          source: "https://api.example.com"
                          id: "b4333c46-49c0-4f62-80d7-f0ef930f1c46"
                          type: "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
                          datacontenttype: "application/json"
                          time: "2023-03-22T05:40:23.682Z"
                          data:
                            subscriptionId: "987654321"
                            bindBreach: true
                            device:
                              phoneNumber: "+123456789"
                      AREA_CHANGE:
                        description: The trigger event when the device area has changed
                        value:
                          specversion: "1.0"
                          source: "https://api.example.com"
                          id: "b4333c46-49c0-4f62-80d7-f0ef930f1c47"
                          type: "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.area-change"
                          datacontenttype: "application/json"
                          time: "2023-03-22T05:41:23.682Z"
                          data:
                            subscriptionId: "987654321"
                            bindBreach: true
                            device:
                              phoneNumber: "+123456789"
              responses:
                "204":
                  description: Successful notification.
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "201":
          description: Created (Successful creation of subscription).
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "202":
          description: Request accepted to be processed. It applies for async creation process.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
              examples:
                RESULT_SUBSCRIPTION_ID:
                  summary: subscription result
                  description: |
                    The result of the asynchronous subscription creation
                  value:
                    id: "1119920371"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionBadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
        "404":
          $ref: "#/components/responses/DeviceNotFound404"
        "409":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionConflict409"
        "422":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionDevice422"
        "429":
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
      security:
        - openId:
            - "iot-sim-fraud-prevention-subscriptions:org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change:create"
            - "iot-sim-fraud-prevention-subscriptions:org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.area-change:create"

    get:
      tags:
        - Subscription Management
      summary: List subscriptions
      description: Retrieve a list of existing subscriptions.
      operationId: listSubscriptions
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/page"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/perPage"
      responses:
        "200":
          description: List of subscription details.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            X-Total-Count:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-count"
            X-Total-Pages:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-pages"
            Link:
              $ref: "../common/CAMARA_common.yaml#/components/headers/link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
      security:
        - openId:
            - "iot-sim-fraud-prevention-subscriptions:read"

  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Subscription Management
      summary: Get subscription details
      description: Retrieve the details of an existing subscription.
      operationId: getSubscription
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: Subscription details.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
      security:
        - openId:
            - "iot-sim-fraud-prevention-subscriptions:read"

    delete:
      tags:
        - Subscription Management
      summary: Delete subscription
      description: Delete an existing subscription. After deletion, no further notifications will be sent.
      operationId: deleteSubscription
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "204":
          description: Subscription successfully deleted.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
        "202":
          description: Request accepted to be processed asynchronously.
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
      security:
        - openId:
            - "iot-sim-fraud-prevention-subscriptions:delete"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"

    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"
  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      description: Subscription identifier that was obtained from the create event subscription operation
      required: true
      schema:
        $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

  schemas:
    # ---------- Notification ----------
    # ─────────────────────────────────────────────────────────────────────────
    # API-specific notification event group
    # ─────────────────────────────────────────────────────────────────────────

    ApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ApiEventType"
      discriminator:
        propertyName: "type"
        mapping:
          org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change: "#/components/schemas/ImeiChangeEvent"
          org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.area-change: "#/components/schemas/AreaChangeEvent"

    ApiEventType:
      type: string
      description: |
        Enum of API-specific event type strings for this API project.
        The reverse-DNS prefix `org.camaraproject.iot-sim-fraud-prevention-subscriptions` makes each value
        globally unique.
      enum:
        - org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change
        - org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.area-change

    ImeiChangeEvent:
      description: Event structure for IMEI change notification
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BindBreachEventData"

    BindBreachEventData:
      description: |
        Event details for a bind breach notification.
        The `device` property is optional: it is returned only when the API consumer provided a
        device identifier in the subscription request (two-legged access token). For a three-legged
        access token no device identifier is returned, in line with the data minimisation rules of
        the CAMARA API Event Subscription and Notification Guide.
      type: object
      required:
        - subscriptionId
        - bindBreach
      properties:
        subscriptionId:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        bindBreach:
          type: boolean
          description: |
            `true` if the device no longer satisfies the bound condition (for example it is no longer the bound device, or it has moved outside the restricted area); `false` if it has returned to the bound condition.
          example: true
        device:
          $ref: "#/components/schemas/Device"

    AreaChangeEvent:
      description: Event structure for area change notification
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BindBreachEventData"

    # ─────────────────────────────────────────────────────────────────────────
    # Subscription lifecycle event group (Commonalities-owned)
    # ─────────────────────────────────────────────────────────────────────────

    SubscriptionLifecycleEvent:
      description: |
        Subscription lifecycle event group, common to all CAMARA APIs that
        support explicit subscriptions.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/SubscriptionLifecycleEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-started: "#/components/schemas/EventSubscriptionStarted"
          org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-updated: "#/components/schemas/EventSubscriptionUpdated"
          org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-ended: "#/components/schemas/EventSubscriptionEnded"

    SubscriptionLifecycleEventType:
      type: string
      description: |
        Enum of subscription lifecycle event type strings.
      enum:
        - org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-started
        - org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-updated
        - org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.subscription-ended

    EventSubscriptionStarted:
      description: event structure for event subscription started
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionStarted"

    EventSubscriptionUpdated:
      description: event structure for event subscription updated
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionUpdated"

    EventSubscriptionEnded:
      description: event structure for event subscription ended
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionEnded"

    NotificationEvent:
      description: |
        Union of all valid notification event groups at the callback endpoint.
      oneOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"

    # ---------- Subscription schemas ----------
    Subscription:
      description: Represents an event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
        - startsAt
      properties:
        protocol:
          $ref: "#/components/schemas/Protocol"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The address to which events shall be delivered.
          example: "https://endpoint.example.com/sink"
        types:
          description: Event types eligible to be delivered.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ApiEventType"
          example:
            - "org.camaraproject.iot-sim-fraud-prevention-subscriptions.v0.imei-change"
        config:
          $ref: "#/components/schemas/Config"
        id:
          $ref: "#/components/schemas/SubscriptionId"
        startsAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        expiresAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        status:
          type: string
          description: Current status of the subscription.
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionResponse"

    SubscriptionAsync:
      description: Response for a subscription request managed asynchronously
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/SubscriptionId"

    SubscriptionId:
      $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

    SubscriptionList:
      description: Response with a paginated list of subscriptions.
      type: object
      required:
        - subscriptions
        - pagination
      properties:
        subscriptions:
          description: Subscriptions list
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/Subscription"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    SubscribeFraudPreventionRequest:
      description: Request to create a subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        config:
          $ref: "#/components/schemas/Config"
        types:
          description: Event types to subscribe to (only one allowed per subscription).
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ApiEventType"
        protocol:
          $ref: "#/components/schemas/Protocol"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The callback URL where notifications will be sent.
          example: "https://endpoint.example.com/sink"
        sinkCredential:
          $ref: "#/components/schemas/SinkCredential"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionRequest"

    Config:
      description: |
        Implementation-specific configuration parameters needed by the subscription manager
        for acquiring events. Extends `ConfigBase` from `CAMARA_event_common.yaml` with the
        required, API-specific `subscriptionDetail` property.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/ConfigBase"
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/SubscriptionDetail"
            initialEvent:
              type: boolean
              description: Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.

    SubscriptionDetail:
      description: |
        Details specific to the subscribed events.
        The `device` property is optional. It MUST be provided when a two-legged access token is
        used (`422 MISSING_IDENTIFIER` otherwise), and MUST NOT be returned when the subscription
        was created with a three-legged access token. When a two-legged access token is used, the
        response SHOULD contain the same identifier type that was provided in the request.
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"

    Protocol:
      $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"

    SinkCredential:
      $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"

    Device:
      description: |
        End-user device able to connect to a mobile network.
        The developer can choose to provide one or more of the following identifiers:
        * `ipv4Address`
        * `ipv6Address`
        * `phoneNumber`
        * `networkAccessIdentifier`
      type: object
      properties:
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        networkAccessIdentifier:
          $ref: "#/components/schemas/NetworkAccessIdentifier"
        ipv4Address:
          $ref: "#/components/schemas/DeviceIpv4Addr"
        ipv6Address:
          $ref: "#/components/schemas/DeviceIpv6Address"
      minProperties: 1

    PhoneNumber:
      description: A public identifier addressing a telephone subscription, formatted according to E.164 with a leading '+'.
      type: string
      pattern: '^\+[1-9][0-9]{4,14}$'
      maxLength: 16
      example: "+123456789"

    NetworkAccessIdentifier:
      description: A public identifier addressing a subscription in a mobile network (e.g., GPSI formatted as External Identifier).
      type: string
      maxLength: 2048
      example: "123456789@domain.com"

    DeviceIpv4Addr:
      description: |
        Identification of a device using its IPv4 address.
        At least one of `privateAddress` or `publicPort` must be provided together with `publicAddress`.
      type: object
      properties:
        publicAddress:
          $ref: "#/components/schemas/SingleIpv4Addr"
        privateAddress:
          $ref: "#/components/schemas/SingleIpv4Addr"
        publicPort:
          $ref: "#/components/schemas/Port"
      anyOf:
        - required: [publicAddress, privateAddress]
        - required: [publicAddress, publicPort]
      example:
        publicAddress: "84.125.93.10"
        publicPort: 59765

    SingleIpv4Addr:
      description: A single IPv4 address with no subnet mask.
      type: string
      format: ipv4
      maxLength: 15
      example: "84.125.93.10"

    Port:
      description: TCP or UDP port number.
      type: integer
      format: int32
      minimum: 0
      maximum: 65535

    DeviceIpv6Address:
      description: |
        A single IPv6 address identifying the device.
      type: string
      format: ipv6
      maxLength: 45
      example: "2001:db8:85a3:8d3:1319:8a2e:370:7344"

    # ---------- Protocol-specific subscription schemas ----------
    HTTPSubscriptionRequest:
      description: Subscription request for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/SubscribeFraudPreventionRequest"
        - type: object
          properties:
            protocolSettings:
              $ref: "#/components/schemas/HTTPSettings"

    HTTPSubscriptionResponse:
      description: Subscription resource returned for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          properties:
            protocolSettings:
              $ref: "#/components/schemas/HTTPSettings"

    HTTPSettings:
      $ref: "../common/CAMARA_event_common.yaml#/components/schemas/HTTPSettings"

  responses:

    DeviceNotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_404_IDENTIFIER_NOT_FOUND"
